name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Pull requests (also from forks) only run the checks: no job they trigger sees a secret.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build

  # develop -> dev, main -> prod (the "prod" GitHub Environment requires your approval).
  # Order matters: schema first, then the code that needs it. Vercel does not deploy on push;
  # the Deploy Hook below starts the build only after the migrations succeeded.
  deploy:
    needs: [check, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to see which files this push changed
      # Deploy only what changed. Unknown history (new branch, force push) deploys everything.
      - name: What changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files" | grep -qE '^(src/|api/|prisma/|scripts/|public/|package(-lock)?\.json$|tsconfig\.json$|vercel\.json$)' \
            && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -q '^web/' && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.api == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.api == 'true'
      - name: Apply database migrations
        if: steps.changes.outputs.api == 'true'
        run: npx prisma migrate deploy
        env:
          # migrate deploy only uses the direct (session pooler) connection
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # Two Vercel projects: the API first (the site proxies /api to it), then the site.
      - name: Deploy the API to Vercel
        if: steps.changes.outputs.api == 'true'
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      - name: Deploy the admin site to Vercel
        if: steps.changes.outputs.web == 'true'
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_WEB" > /dev/null
        env:
          VERCEL_DEPLOY_HOOK_WEB: ${{ secrets.VERCEL_DEPLOY_HOOK_WEB }}
